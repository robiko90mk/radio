<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>yoRadio — Remote</title>
  <link rel="stylesheet" href="style.v2.css?v=2">
  <meta name="theme-color" content="#222">
</head>
<body>
  <header>
    <h1>yoRadio</h1>
    <div class="status" id="ws-status">WS: rozłączony</div>
    <div class="theme-toggle">
      <label>Motyw</label>
      <select id="theme-select">
        <option value="auto">Auto</option>
        <option value="dark">Ciemny</option>
        <option value="light">Jasny</option>
      </select>
    </div>
  </header>

  <main>
    <section class="now-playing card">
      <div class="cover" id="cover"></div>
      <div class="meta">
        <div id="title">—</div>
        <div id="artist">—</div>
        <div id="stream">—</div>
      </div>
    </section>

    <section class="controls card play-controls">
      <button id="prev" class="btn" aria-label="previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 18V6l-8 6 8 6zM20 6v12h-2V6h2z" fill="currentColor"/></svg>
      </button>
      <button id="play" class="btn play-btn" aria-label="play">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
      </button>
      <button id="next" class="btn" aria-label="next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6v12h2V6H3zm4 0v12l8-6-8-6z" fill="currentColor"/></svg>
      </button>
      <label class="vol">Vol <input id="volume" type="range" min="0" max="100"></label>
    </section>

    <section class="playlist card">
      <h2>Lista odtwarzania</h2>
      <ul id="playlist" class="list" draggable="true"></ul>
      <div class="playlist-actions">
        <button id="add-url" class="btn">Dodaj URL</button>
        <button id="import-playlist" class="btn">Importuj playlistę</button>
        <input id="import-file" type="file" accept=".csv,.txt" style="display:none">
        <button id="save-playlist" class="btn">Zapisz</button>
      </div>
    </section>

    <section class="extras card">
      <h3>Presety korektora</h3>
      <div class="eq-presets">
        <button data-preset="flat" class="btn">Flat</button>
        <button data-preset="rock" class="btn">Rock</button>
        <button data-preset="jazz" class="btn">Jazz</button>
        <button data-preset="pop" class="btn">Pop</button>
        <button id="save-eq" class="btn">Zapisz preset</button>
      </div>
      <div class="eq-sliders" id="eq-sliders">
        <!-- sliders inserted by JS: bands 60,250,1k,4k,10k -->
      </div>
      <h3>Wizualizer</h3>
      <canvas id="viz" height="110"></canvas>
    </section>
  </main>

  <footer>
    <small>Połączono z urządzeniem: <span id="device-host">—</span></small>
  </footer>

  <script src="app.v2.js?v=2"></script>
</body>
</html>
