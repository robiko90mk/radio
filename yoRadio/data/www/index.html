<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>yoRadio — Remote</title>
  <link rel="stylesheet" href="style.v2.css?v=2">
  <meta name="theme-color" content="#222">
</head>
<body>
  <header>
    <h1>yoRadio</h1>
    <div class="status" id="ws-status">WS: rozłączony</div>
    <div class="theme-toggle">
      <label>Motyw</label>
      <select id="theme-select">
        <option value="auto">Auto</option>
        <option value="dark">Ciemny</option>
        <option value="light">Jasny</option>
      </select>
    </div>
    <div style="margin-left:12px">
      <button id="open-settings" class="btn">Ustawienia</button>
    </div>
  </header>

  <main>
    <section class="now-playing card">
      <div class="cover" id="cover"></div>
      <div class="meta">
        <div id="title">—</div>
        <div id="artist">—</div>
        <div id="stream">—</div>
      </div>
    </section>

    <section class="controls card play-controls">
      <button id="prev" class="btn" aria-label="previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 18V6l-8 6 8 6zM20 6v12h-2V6h2z" fill="currentColor"/></svg>
      </button>
      <button id="play" class="btn play-btn" aria-label="play">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
      </button>
      <button id="next" class="btn" aria-label="next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6v12h2V6H3zm4 0v12l8-6-8-6z" fill="currentColor"/></svg>
      </button>
      <label class="vol">Vol <input id="volume" type="range" min="0" max="100"></label>
    </section>

    <section class="playlist card">
      <h2>Lista odtwarzania</h2>
      <ul id="playlist" class="list" draggable="true"></ul>
      <div class="playlist-actions">
        <button id="add-url" class="btn">Dodaj URL</button>
        <button id="import-playlist" class="btn">Importuj playlistę</button>
        <input id="import-file" type="file" accept=".csv,.txt" style="display:none">
        <button id="export-playlist" class="btn">Eksportuj</button>
        <button id="save-playlist" class="btn">Zapisz</button>
      </div>
    </section>

    <section class="extras card">
      <h3>Wizualizer</h3>
      <canvas id="viz" height="110"></canvas>
    </section>
  </main>

  <section class="settings card" id="settings-section" style="display:none;grid-column:1 / -1;margin:26px">
    <h2>Ustawienia</h2>
    <div>
      <form id="settings-form">
        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <div style="flex:1;min-width:220px">
            <label>Język interfejsu<br>
              <select id="s-lang">
                <option value="PL">Polski</option>
                <option value="EN">English</option>
                <option value="DE">Deutsch</option>
              </select>
            </label>
          </div>
          <div style="flex:1;min-width:220px">
            <label>Głośność początkowa<br>
              <input id="s-initial-volume" type="number" min="0" max="100">
            </label>
          </div>
          <div style="flex:1;min-width:220px">
            <label><input id="s-force-mono" type="checkbox"> Wymuś mono</label><br>
            <label><input id="s-remove-audio-controls" type="checkbox"> Usuń kontrolki audio</label>
          </div>
          <div style="flex:1;min-width:220px">
            <label>Stała głośność (0-255)<br>
              <input id="s-fixed-volume" type="number" min="0" max="255">
            </label>
            <label>Pin wyciszenia<br>
              <input id="s-mute-pin" type="number" min="0" max="255">
            </label>
          </div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="apply-settings" class="btn primary" type="button">Zastosuj</button>
          <button id="save-settings" class="btn" type="button">Zapisz (demo)</button>
          <button id="cancel-settings" class="btn" type="button">Anuluj</button>
        </div>
      </form>
      <div style="margin-top:18px">
        <h3>Presety korektora</h3>
        <div class="eq-presets">
          <button data-preset="flat" class="btn">Flat</button>
          <button data-preset="rock" class="btn">Rock</button>
          <button data-preset="jazz" class="btn">Jazz</button>
          <button data-preset="pop" class="btn">Pop</button>
          <button id="save-eq" class="btn">Zapisz preset</button>
        </div>
        <div class="eq-sliders" id="settings-eq-sliders">
          <!-- sliders inserted by JS -->
        </div>
      </div>
      <div style="margin-top:18px">
        <h3>Import ustawień z projektu (podgląd)</h3>
        <button id="import-from-project" class="btn">Pobierz myoptions.h</button>
        <pre id="imported-settings" style="white-space:pre-wrap;max-height:240px;overflow:auto;margin-top:8px;display:none"></pre>
      </div>
    </div>
  </section>

  <footer>
    <small>Połączono z urządzeniem: <span id="device-host">—</span></small>
  </footer>

  <script src="app.v2.js?v=2"></script>
</body>
</html>
